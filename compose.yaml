services:
  dav-sync-cal:
    image: ghcr.io/mrbridgefarm/webcal:latest
    container_name: dav-sync-cal
    restart: unless-stopped
    expose:
      - "3000"
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DEFAULT_CALDAV_URL=${DEFAULT_CALDAV_URL:-}
      - ALLOW_INSECURE_TLS=${ALLOW_INSECURE_TLS:-false}
    volumes:
      - dav-sync-data:/app/data
    networks:
      - pangolin
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  dav-sync-data:

networks:
  pangolin:
    name: pangolin
    external: true
