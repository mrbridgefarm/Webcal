services:
  dav-sync-cal:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dav-sync-cal
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DEFAULT_CALDAV_URL=${DEFAULT_CALDAV_URL:-}
      - ALLOW_INSECURE_TLS=${ALLOW_INSECURE_TLS:-false}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
