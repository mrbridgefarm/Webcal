# ==============================================================================
# Eksempel på Docker Compose (compose.yaml) med "pangolin" netværk
# Henter det færdigbyggede Multi-Arch image (x86_64 & ARM64) fra GHCR:
#   ghcr.io/mrbridgefarm/webcal:latest
# ==============================================================================

services:
  dav-sync-cal:
    image: ghcr.io/mrbridgefarm/webcal:latest
    container_name: dav-sync-cal
    restart: unless-stopped

    # Eksponerer port 3000 internt på "pangolin"-netværket
    # (I Pangolin / Reverse Proxy kan du pege direkte på: http://dav-sync-cal:3000)
    expose:
      - "3000"

    # Valgfrit: Åbn også porten direkte på VM'ens host-IP
    ports:
      - "${PORT:-3000}:3000"

    environment:
      - NODE_ENV=production
      - PORT=3000
      # Standard Mailcow/SOGo CalDAV URL som appen forbinder til ved login:
      - DEFAULT_CALDAV_URL=${DEFAULT_CALDAV_URL:-https://mail.ditdomæne.dk/SOGo/dav/}
      # Sæt til true hvis Mailcow kører med selv-signeret certifikat internt:
      - ALLOW_INSECURE_TLS=${ALLOW_INSECURE_TLS:-false}

    # Gemmer offentlige delingslinks ved container-opdateringer
    volumes:
      - dav-sync-data:/app/data

    networks:
      - pangolin

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  dav-sync-data:

networks:
  pangolin:
    name: pangolin
    external: true
